version: "2"

run:
  timeout: 5m
  build-tags:
    - integration

linters:
  default: none
  enable:
    # Correctness: unchecked errors, ineffective assignments, dead code.
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    # Resource-leak specific: unclosed rows/statements/response bodies.
    - rowserrcheck
    - sqlclosecheck
    - bodyclose
    # Security: weak randomness, command injection, unhandled crypto errors, etc.
    - gosec
    # Bug-prone patterns staticcheck doesn't cover (e.g. suspicious ranges,
    # deferred loop variables).
    - gocritic
  settings:
    gosec:
      # G104 duplicates errcheck; excluded to avoid double-reporting the
      # same unchecked-error finding under two different linters.
      excludes:
        - G104

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

openapi: 3.1.0
info:
  title: Order Food Online - OpenAPI 3.1
  description: |-
    This is a e-commerce API based on the OpenAPI 3.1 specification.  You can find out more about

    Use API key `apitest`, or a JWT from `POST /auth/token` (demo user
    `demo` / `demo1234`) sent as `Authorization: Bearer <token>`.

    Some useful links:
    - [Repository](https://github.com/oolio-group/front-end-cart)

  version: 1.0.0
externalDocs:
  description: Find out more about the challenge
  url: http://swagger.io
servers:
  - url: https://orderfoodonline.deno.dev/api
tags:
  - name: product
    description: Everything about products
  - name: order
    description: Place Orderso
  - name: auth
    description: >-
      Extension beyond the base spec: JWT access tokens.
paths:
  /auth/token:
    post:
      tags:
        - auth
      summary: Get an access token
      description: >-
        Extension beyond the base spec. Exchanges a username and password
        for a short-lived HS256 JWT carrying the create_order scope.
      operationId: createToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenReq'
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '400':
          description: Invalid JSON body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Wrong username or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /product:
    get:
      tags:
        - product
      summary: List products
      description: Get all products available for order
      operationId: listProducts
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
  /product/{productId}:
    get:
      tags:
        - product
      summary: Find product by ID
      description: Returns a single product
      operationId: getProduct
      parameters:
        - name: productId
          in: path
          description: ID of product to return
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid ID supplied
        '404':
          description: Product not found
  /order:
    post:
      tags:
        - order
      summary: Place an order
      description: Place a new order in the store
      operationId: placeOrder
      security:
        - api_key: ["create_order"]
        - bearerAuth: ["create_order"]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderReq'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid input
        '401':
          description: >-
            No credentials, or a malformed, expired or tampered bearer token
        '403':
          description: Wrong api_key, or a token without the create_order scope
        '422':
          description: Validation exception
components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: string
          examples: ["0000-0000-0000-0000"]
        items:
          type: array
          items:
            type: object
            properties:
              productId:
                type: string
                description: ID of the product
              quantity:
                type: integer
                description: Item count
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        couponCode:
          type: string
          description: >-
            Extension beyond the base spec: the coupon code applied to
            this order, if any.
        subtotal:
          type: number
          format: float
          description: >-
            Extension beyond the base spec: sum of item prices before
            any discount.
        discounts:
          type: number
          format: float
          examples: [10.0]
          description: >-
            Amount deducted for a valid coupon, from the configured
            discount rule (5% of subtotal by default), 0 when none was
            applied. Already part of the base spec.
        total:
          type: number
          format: float
          examples: [90.0]
          description: 'Subtotal minus discounts. Already part of the base spec.'
    OrderReq:
      type: object
      description: Place a new order
      properties:
        couponCode:
          type: string
          description: Optional promo code applied to the order
        items:
          type: array
          items:
            type: object
            properties:
              productId:
                type: string
                description: ID of the product (required)
              quantity:
                type: integer
                description: Item count (required)
            required:
              - productId
              - quantity
      required:
        - items
    Product:
      type: object
      properties:
        id:
          type: string
          examples: ["10"]
        name:
          type: string
          examples: ["Chicken Waffle"]
        price:
          type: number
          format: float
          description: Selling price
        category:
          type: string
          examples: [Waffle]
        image:
          type: object
          description: >-
            Deterministic placeholder images (picsum.photos), keyed by
            product id. The assignment gave no real product photography.
          properties:
            thumbnail:
              type: string
              examples: ["https://picsum.photos/seed/product-10/150/150"]
            mobile:
              type: string
              examples: ["https://picsum.photos/seed/product-10/375/250"]
            tablet:
              type: string
              examples: ["https://picsum.photos/seed/product-10/600/400"]
            desktop:
              type: string
              examples: ["https://picsum.photos/seed/product-10/900/600"]
    TokenReq:
      type: object
      description: Extension beyond the base spec.
      properties:
        username:
          type: string
          examples: [demo]
        password:
          type: string
          format: password
          examples: [demo1234]
      required:
        - username
        - password
    Token:
      type: object
      description: Extension beyond the base spec.
      properties:
        accessToken:
          type: string
          description: "HS256 JWT; send it as `Authorization: Bearer <accessToken>`"
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: Seconds until the token expires
          examples: [900]
      required:
        - accessToken
        - tokenType
        - expiresIn
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        type:
          type: string
        message:
          type: string
      xml:
        name: '##default'
  securitySchemes:
    api_key:
      type: apiKey
      name: api_key
      in: header
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Extension beyond the base spec: a token from POST /auth/token.

# Local Prometheus (compose profile "local"): scrapes the API for the local
# Grafana. Grafana Cloud uses Alloy instead (deploy/alloy/config.alloy).
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: oolio-kart
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8080"]

name: CI

on:
  push:
    branches: [main, submission-v2]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      - name: Verify formatting
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "these files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # Pinned, not @latest: a new linter release shouldn't change CI
      # results on its own. Keep in step with the local golangci-lint.
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --build-tags=integration ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -race -count=1
